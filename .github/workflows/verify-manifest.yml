name: Verify integrity

# Checks that the tracked original files still match MANIFEST.txt.
# MANIFEST.txt covers app/, resources/, analysis/, unpacked/ and native-re/
# (4,240 files, ~45 MB). runtime/ and prefix/ (~1.8 GB) are intentionally
# excluded, so we use a sparse checkout to avoid downloading them.

on:
  push:
    branches: [ main ]
    paths:
      - 'MANIFEST.txt'
      - 'app/**'
      - 'resources/**'
      - 'analysis/**'
      - 'unpacked/**'
      - 'native-re/**'
      - '.github/workflows/verify-manifest.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    name: md5sum -c MANIFEST.txt
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (sparse - manifest-covered paths only)
        uses: actions/checkout@v7
        with:
          lfs: false
          sparse-checkout: |
            MANIFEST.txt
            app
            resources
            analysis
            unpacked
            native-re
          sparse-checkout-cone-mode: false

      - name: Verify manifest
        run: |
          set -euo pipefail
          echo "Verifying $(wc -l < MANIFEST.txt) entries..."
          if md5sum -c MANIFEST.txt > /tmp/manifest.out 2>&1; then
            echo "::notice title=Integrity::All MANIFEST.txt entries verified OK"
          else
            echo "::error title=Integrity::MANIFEST.txt verification FAILED"
            grep -v ': OK$' /tmp/manifest.out | head -50
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          total=$(wc -l < MANIFEST.txt)
          bad=$(grep -cv ': OK$' /tmp/manifest.out || true)
          {
            echo "### Integrity check"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Entries in manifest | ${total} |"
            echo "| Mismatches | ${bad} |"
          } >> "$GITHUB_STEP_SUMMARY"
